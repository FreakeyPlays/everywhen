# --- glib 0.18.5: real unsoundness, but pinned by the GTK3 stack -------------

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429" # also GHSA-wrw7-89jp-8q8g -- unsoundness in glib::VariantStrIter
reason = "Fixed in glib 0.20, but gtk 0.18 requires glib ^0.18, so it cannot be bumped while Tauri is on the GTK3 stack. Unsound API is not called by this app."
ignoreUntil = 2027-03-01T00:00:00Z

