# OSV-Scanner config for the Tauri crate.
#
# osv-scanner only reads a config from the directory holding the scanned
# lockfile, so this file must live next to Cargo.lock.
#
# Every entry below is a transitive dependency of `tauri` that we cannot move
# off of: Tauri 2.x renders on Linux through webkit2gtk -> gtk 0.18, and the
# gtk-rs 0.18 line was deprecated wholesale by its maintainers in favour of the
# GTK4 bindings. Tauri has no GTK4 backend yet, so there is no version of
# `tauri` we can upgrade to that drops these. Re-check when Tauri ships a
# GTK4/non-GTK Linux backend.
#
# Note these only affect Linux builds; the macOS and Windows backends do not
# pull in the GTK stack at all.

# --- gtk-rs 0.18 GTK3 bindings: unmaintained (no fixed version exists) -------

[[IgnoredVulns]]
id = "RUSTSEC-2024-0413" # atk
reason = "Unmaintained gtk-rs GTK3 binding, pulled in by tauri -> webkit2gtk. No fixed version; no GTK4 backend in Tauri 2.x."
ignoreUntil = 2027-03-01T00:00:00Z

